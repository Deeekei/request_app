<!DOCTYPE html>
<html>
<head>
    <title>Отладка авторизации</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>🔍 Отладка авторизации</h1>

    <h2>LocalStorage:</h2>
    <pre id="storage"></pre>

    <h2>Действия:</h2>
    <button onclick="checkAuth()">Проверить авторизацию</button>
    <button onclick="clearStorage()">Очистить localStorage</button>
    <button onclick="goToDashboard()">Перейти на dashboard</button>

    <h2>Результат:</h2>
    <pre id="result"></pre>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function updateStorage() {
            const storage = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                storage[key] = localStorage.getItem(key);
            }
            document.getElementById('storage').textContent =
                JSON.stringify(storage, null, 2);
        }

        async function checkAuth() {
            const result = document.getElementById('result');
            result.textContent = 'Проверка...';

            if (!isAuthenticated()) {
                result.innerHTML = '<span class="error">❌ Не авторизован (нет токена)</span>';
                return;
            }

            try {
                const user = await getCurrentUser();
                result.innerHTML = '<span class="success">✅ Авторизован</span>\n\n';
                result.innerHTML += 'Данные пользователя:\n' + JSON.stringify(user, null, 2);
            } catch (error) {
                result.innerHTML = `<span class="error">❌ Ошибка: ${error.message}</span>`;
            }
        }

        function clearStorage() {
            localStorage.clear();
            updateStorage();
            document.getElementById('result').textContent = 'LocalStorage очищен';
        }

        function goToDashboard() {
            window.location.href = 'dashboard.html';
        }

        // Обновляем при загрузке
        updateStorage();
    </script>
</body>
</html>
